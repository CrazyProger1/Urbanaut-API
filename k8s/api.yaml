apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: urbanaut
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: urbanaut
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: urbanaut
      initContainers:
        - name: migrate
          image: crazyproger1/urbanaut-api:latest
          command: ["uv", "run", "python", "manage.py", "migrate"]
          envFrom:
            - secretRef:
                name: urbanaut-env
      containers:
        - name: api
          image: crazyproger1/urbanaut-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: urbanaut-env
          volumeMounts:
            - name: media
              mountPath: /var/www
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: urbanaut
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP