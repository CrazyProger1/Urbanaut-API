apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: urbanaut-secrets
  namespace: urbanaut
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: urbanaut-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: urbanaut